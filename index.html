<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中外艺术史时间轴</title>
    <link rel="stylesheet" href="./styles.css?v=20260615-prehistory" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Art History Atlas</p>
        <h1>中外艺术史时间轴</h1>
      </div>
      <nav class="view-tabs" aria-label="视图切换">
        <button class="tab-button active" data-view="all" type="button">总览</button>
        <button class="tab-button" data-view="geo" type="button">地理位置</button>
        <button class="tab-button" data-view="compare" type="button">中外对照</button>
        <button class="tab-button" data-view="artists" type="button">艺术家</button>
        <button class="tab-button" data-view="network" type="button">关系网</button>
      </nav>
    </header>

    <main>
      <section class="hero-panel">
        <div class="hero-copy">
          <div class="search-row">
            <label class="search-box">
              <span>搜索</span>
              <input id="searchInput" type="search" placeholder="例如：汉代、埃及、哥特、死亡观、卢浮宫" />
            </label>
            <label class="select-box">
              <span>时间轴</span>
              <select id="periodSelect">
                <option value="all">全部时间段</option>
              </select>
            </label>
          </div>
          <div class="region-explorer">
            <div class="region-explorer-head">
              <div>
                <span>地区观察</span>
                <strong>从历史分期进入艺术现场</strong>
              </div>
              <div class="region-switch" role="group" aria-label="地区切换">
                <button class="active" data-region-scope="china" type="button">中国地区</button>
                <button data-region-scope="world" type="button">世界地区</button>
              </div>
            </div>
            <div id="regionExplorerCanvas" class="region-explorer-canvas"></div>
          </div>
        </div>
      </section>

      <section class="material-lenses" aria-labelledby="materialLensTitle">
        <div class="section-title material-lens-title">
          <div>
            <p>横向观察</p>
            <h2 id="materialLensTitle">同一种艺术，在时间里如何改变</h2>
          </div>
          <div id="materialLensTabs" class="material-lens-tabs" role="tablist" aria-label="艺术门类"></div>
        </div>
        <div id="materialLensCanvas" class="material-lens-canvas"></div>
      </section>

      <section class="layout">
        <section class="content-area">
          <div id="cardsGrid" class="cards-grid"></div>
          <section id="comparePanel" class="compare-panel" hidden>
            <div class="section-title">
              <h2>中外时间轴对比</h2>
            </div>
            <div id="compareGrid" class="parallel-timeline"></div>
          </section>
          <section id="geoPanel" class="geo-panel" hidden>
            <div class="section-title">
              <h2>地理位置</h2>
            </div>
            <div id="geoCanvas" class="geo-canvas"></div>
          </section>
          <section id="artistsPanel" class="artists-panel" hidden>
            <div class="section-title">
              <h2>艺术家与经典作品</h2>
            </div>
            <div id="artistsGrid" class="artists-grid"></div>
          </section>
          <section id="networkPanel" class="network-panel" hidden>
            <div class="section-title">
              <h2>人物关系拓扑网</h2>
            </div>
            <div id="networkCanvas" class="network-canvas"></div>
          </section>
        </section>
      </section>
    </main>

    <dialog id="imageDialog" class="image-dialog" aria-label="作品大图">
      <button class="dialog-close" type="button" aria-label="关闭大图">×</button>
      <figure>
        <img id="dialogImage" alt="" />
        <figcaption>
          <strong id="dialogTitle"></strong>
          <span id="dialogMeta"></span>
          <small id="dialogFacts"></small>
        </figcaption>
      </figure>
    </dialog>

    <template id="eraTemplate">
      <article class="era-card">
        <div class="era-card-header">
          <div>
            <p class="era-kicker"></p>
            <h2></h2>
          </div>
          <span class="region-pill"></span>
        </div>
        <p class="context"></p>
        <div class="relation-grid"></div>
        <div class="info-columns"></div>
        <div class="forms-block">
          <h3>艺术形式细分</h3>
          <div class="forms-list"></div>
        </div>
        <div class="artwork-strip"></div>
        <div class="people-block">
          <h3>代表人物与关系</h3>
          <div class="people-list"></div>
        </div>
      </article>
    </template>

    <!-- Cloudflare Web Analytics -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "aa7cfef2388c47c08c2b725b2efc7fac"}'></script>
    <!-- End Cloudflare Web Analytics -->
    <script src="./script.js?v=20260615-prehistory"></script>
  </body>
</html>
